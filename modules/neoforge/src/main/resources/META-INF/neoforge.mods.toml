modLoader = "javafml"
loaderVersion = "[4,)"
issueTrackerURL = "https://github.com/0xCoDSnet/Beltborne-Lanterns-Accessories-Layer/issues"
license="${mod_license}"

[[mixins]]
config = "bl_accessories_layer.mixins.json"

[[mods]]
modId = "bl_accessories_layer"
version="${version}"
displayName="${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''
logoFile = "assets/bl_accessories_layer/icon.png"

[[dependencies.bl_accessories_layer]]
modId = "neoforge"
type = "required"
versionRange = "${neoforge_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.bl_accessories_layer]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.bl_accessories_layer]]
modId = "beltborne_lanterns"
type = "required"
versionRange = "[${beltborne_lanterns_min_version},${beltborne_lanterns_max_exclusive})"
ordering = "NONE"
side = "BOTH"

[[dependencies.bl_accessories_layer]]
modId = "accessories"
type = "required"
versionRange = "[${accessories_min_version},)"
ordering = "NONE"
side = "BOTH"
